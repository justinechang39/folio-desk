[package]
name = "folio-desk"
version = "0.1.0"
description = "A quiet workspace for PDFs, side by side."
authors = ["Justine Chang"]
license = "MIT"
edition = "2021"
rust-version = "1.98"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
native-smoke = []
